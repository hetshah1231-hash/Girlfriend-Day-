<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️ Happy Girlfriend Day ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{

font-family:Poppins,sans-serif;

background:
linear-gradient(135deg,#090909,#1b0028,#32004f);

overflow-x:hidden;

color:white;

}

/* Animated Background */

body::before{

content:"";

position:fixed;

width:100%;

height:100%;

background:

radial-gradient(circle,#ff0066 1px,transparent 1px);

background-size:40px 40px;

animation:bgMove 20s linear infinite;

opacity:.18;

z-index:-2;

}

@keyframes bgMove{

0%{transform:translateY(0);}

100%{transform:translateY(-300px);}

}

/* Floating Hearts */

.heart{

position:fixed;

bottom:-50px;

color:#ff4d88;

animation:float linear infinite;

opacity:.5;

z-index:-1;

}

@keyframes float{

0%{

transform:translateY(0) rotate(0deg);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-120vh) rotate(360deg);

opacity:0;

}

}

/* Hero */

.hero{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

text-align:center;

padding:20px;

}

.hero h1{

font-family:"Great Vibes";

font-size:90px;

color:#fff;

text-shadow:

0 0 10px #ff4d88,

0 0 30px #ff4d88,

0 0 60px #ff0066;

animation:glow 2s infinite alternate;

}

@keyframes glow{

from{

transform:scale(1);

}

to{

transform:scale(1.05);

}

}

.hero h2{

margin-top:20px;

font-size:28px;

font-weight:300;

}

.hero button{

margin-top:40px;

padding:18px 45px;

border:none;

border-radius:50px;

background:#ff0066;

color:white;

font-size:20px;

cursor:pointer;

box-shadow:0 0 25px #ff0066;

transition:.4s;

}

.hero button:hover{

transform:scale(1.08);

}
  /* LOVE LETTER */

.letter{

max-width:900px;

margin:80px auto;

padding:35px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border-radius:25px;

border:1px solid rgba(255,255,255,.15);

box-shadow:0 0 35px rgba(255,0,102,.25);

}

.letter h2{

font-family:"Great Vibes";

font-size:60px;

margin-bottom:25px;

color:#ff8ab7;

}

.letter p{

font-size:19px;

line-height:2;

text-align:center;

}

/* PHOTO GALLERY */

.gallery{

padding:80px 20px;

text-align:center;

}

.gallery h2{

font-family:"Great Vibes";

font-size:60px;

margin-bottom:35px;

}

.photos{

display:flex;

justify-content:center;

flex-wrap:wrap;

gap:20px;

}

.photo{

width:260px;

height:340px;

border-radius:20px;

overflow:hidden;

background:rgba(255,255,255,.1);

border:2px solid rgba(255,255,255,.2);

transition:.4s;

}

.photo img{

width:100%;

height:100%;

object-fit:cover;

}

.photo:hover{

transform:scale(1.05);

box-shadow:0 0 25px #ff4d88;

}

/* END MESSAGE */

.end{

padding:120px 20px;

text-align:center;

}

.end h1{

font-family:"Great Vibes";

font-size:90px;

color:#fff;

text-shadow:0 0 25px #ff0066;

}

.end h3{

margin-top:20px;

font-size:26px;

font-weight:300;

}

/* MOBILE */

@media(max-width:768px){

.hero h1{

font-size:60px;

}

.hero h2{

font-size:20px;

}

.letter h2{

font-size:42px;

}

.gallery h2{

font-size:42px;

}

.end h1{

font-size:55px;

}

.photo{

width:90%;

height:300px;

}

  }
